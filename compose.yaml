# Infra local de desenvolvimento: Postgres (metadados das geracoes) e MinIO (imagens).
# Subir: docker compose up -d
# Credenciais vem do .env na raiz do repo (lido automaticamente pelo compose),
# com defaults de dev abaixo para funcionar sem configuracao.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marmore}
      POSTGRES_USER: ${POSTGRES_USER:-marmore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marmore}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marmore} -d ${POSTGRES_DB:-marmore}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marmore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marmore123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: cria o bucket se nao existir (idempotente).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-marmore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-marmore123}
      MINIO_BUCKET: ${MINIO_BUCKET:-marmore-imagens-geradas}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET"

volumes:
  pgdata:
  miniodata:
