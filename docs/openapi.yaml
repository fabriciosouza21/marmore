openapi: 3.1.0

info:
  title: marmore-api
  version: 0.1.0
  description: |
    API de edicao de imagem do projeto marmore. Gera uma versao da foto do
    ambiente com a pedra escolhida aplicada ao Balcao, via modelo de edicao
    de imagem da OpenAI (gpt-image).

    Stack: Spring Boot 4.1, Java 26, WebFlux (router funcional).

    Endpoints:
      - `GET /pedras`: catalogo de pedras (id, nome comercial, categoria),
        alimentado por `data/pedras/catalogo.json` no servidor.
      - `GET /pedras/{id}/imagem`: bytes da imagem de referencia da pedra.
      - `POST /images/edit`: recebe a foto do ambiente (parte `image`) e o id
        da pedra escolhida (parte `pedra`); o backend resolve a imagem da
        pedra no catalogo, interpola o nome comercial no prompt e envia
        ambiente + pedra ao gateway de IA; devolve o resultado como SSE.
      - `GET /images`: resumos dos metadados das imagens geradas (mais
        recentes primeiro), com a pedra e o produto usados.
      - `GET /images/{id}/arquivo`: bytes PNG da imagem gerada.

    Autenticacao stateless por API key no header `X-API-Key`.
  license:
    name: Proprietario
  contact:
    name: marmore

servers:
  - url: http://localhost:8080
    description: Local (padrao)

tags:
  - name: Imagem
    description: Geracao/edicao de imagem
  - name: Pedra
    description: Catalogo de pedras

paths:
  /images:
    get:
      tags: [Imagem]
      operationId: listaImagensGeradas
      summary: Lista os metadados das imagens geradas
      description: |
        Resumos dos metadados das imagens geradas com sucesso, mais
        recentes primeiro. A imagem em si vem de
        `GET /images/{id}/arquivo`.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de resumos, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImagemGeradaResumo'
              example:
                - id: 3f8e2c1a-9b4d-4c3e-a1b2-cd5e6f708192
                  criado_em: '2026-09-01T14:32:00Z'
                  modelo: gpt-image-1
                  custo_brl: 0.27
                  latencia_ms: 12345
                  pedra: verde_ubatuba
                  nome_pedra: Verde Ubatuba
                  produto: pia-americana
                  nome_produto: Pia americana
        '401':
          description: API key ausente ou invalida no header `X-API-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /images/{id}/arquivo:
    get:
      tags: [Imagem]
      operationId: arquivoDaImagemGerada
      summary: Bytes PNG da imagem gerada
      description: |
        Bytes da imagem baixados do object storage, servidos como
        `image/png`. Usado pela galeria do frontend para exibir a imagem.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Id da imagem gerada (vindo de `GET /images`).
      responses:
        '200':
          description: Bytes da imagem.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Id malformado ou inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key ausente ou invalida no header `X-API-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pedras:
    get:
      tags: [Pedra]
      operationId: listaPedras
      summary: Lista as pedras do catalogo
      description: |
        Catalogo carregado do servidor (`data/pedras/catalogo.json`), na
        ordem do arquivo. Usado pelo seletor do frontend; o campo `arquivo`
        do catalogo e interno e nao e exposto.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de pedras na ordem do catalogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PedraResumo'
              example:
                - id: verde_ubatuba
                  nome: Verde Ubatuba
                  categoria: Granitos
                - id: branco_dallas
                  nome: Branco Dallas
                  categoria: Granitos
        '401':
          description: API key ausente ou invalida no header `X-API-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pedras/{id}/imagem:
    get:
      tags: [Pedra]
      operationId: imagemDaPedra
      summary: Imagem de referencia da pedra
      description: |
        Bytes do arquivo de imagem da pedra no catalogo, com Content-Type
        conforme a extensao (image/png ou image/jpeg). Amostra visual do
        seletor do frontend.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Id da pedra no catalogo (ex.: `verde_ubatuba`).
      responses:
        '200':
          description: Bytes da imagem da pedra.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Id inexistente no catalogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: API key ausente ou invalida no header `X-API-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /images/edit:
    post:
      tags: [Imagem]
      operationId: editImage
      summary: Edita a foto do ambiente aplicando a pedra (SSE)
      description: |
        Recebe a foto do ambiente e devolve, como stream Server-Sent Events
        (`text/event-stream`), o progresso e o resultado da geracao.

        **Predicados obrigatorios do router** (se ausentes, o Spring nao
        casa a rota e devolve 404/406):
          * `Content-Type: multipart/form-data`
          * `Accept: text/event-stream`

        **Sequencia de eventos SSE** (eventos sem nome sao do tipo default
        `message`; o heartbeat e nomeado `ping`):

        ```
        data:{"fase":"recebido"}
        data:{"fase":"redimensionando"}
        data:{"fase":"gerando"}

        event:ping                       # a cada 15s, ate o resultado
        event:ping

        # ramo de SUCESSO (terminal):
        data:{"latency_ms":12345,"custo_brl":0.27,"usage":{...}}
        data:<base64 PNG puro>           # payload cru, sem envelope JSON

        # OU ramo de FALHA (terminal):
        data:{"error":"unable to decode input image","latency_ms":120}
        ```

        O `custo_brl` e o `usage` podem ser `null` (combinacao
        modelo/qualidade/tamanho fora da tabela de precos, ou falha da
        cotacao USD->BRL). Nesses casos a geracao ainda e entregue com
        sucesso; apenas o custo fica ausente.

        Falhas de negocio (ex.: `OPENAI_API_KEY` ausente, imagem
        indecodificavel, erro do gateway) NAO viram status HTTP de erro:
        trafegam como evento SSE `error` dentro do stream 200. Apenas
        problemas de contrato (sem a parte `image`) e de autenticacao
        viram 400/401 fora do stream.

        A pedra de referencia e resolvida no catalogo do servidor pelo id
        recebido na parte `pedra` (imagem lida de `data/pedras/`), e o nome
        comercial da pedra e interpolado no prompt. Pedra sem id valido no
        catalogo vira evento SSE `error` ("pedra nao encontrada no
        catalogo"), sem chamar o gateway.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, pedra]
              properties:
                image:
                  type: string
                  format: binary
                  description: Foto do ambiente a editar (JPG/PNG).
                pedra:
                  type: string
                  description: |
                    Id da pedra escolhida no catalogo (ex.: `verde_ubatuba`).
                    Veja `GET /pedras`. Obrigatorio; ausente ou em branco
                    responde 400 fora do stream.
            encoding:
              image:
                contentType: image/png, image/jpeg
      parameters:
        - $ref: '#/components/parameters/AcceptSse'
      responses:
        '200':
          description: Stream SSE com progresso e resultado da geracao.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream de frames SSE. Cada frame e `event:<nome>\n` (so
                  para `ping`) seguido de `data:<payload>\n\n`. Os demais
                  eventos usam o tipo default `message`.
              examples:
                sucesso:
                  summary: Geracao concluida
                  value: |
                    data:{"fase":"recebido"}
                    data:{"fase":"redimensionando"}
                    data:{"fase":"gerando"}
                    event:ping
                    data:{"latency_ms":12345,"custo_brl":0.27,"usage":{"input_tokens":1200}}
                    data:iVBORw0KGgoAAAANSUhEUgAA...
                falha_dominio:
                  summary: Erro de negocio dentro do stream
                  value: |
                    data:{"fase":"recebido"}
                    data:{"fase":"redimensionando"}
                    data:{"fase":"gerando"}
                    event:ping
                    data:{"error":"unable to decode input image","latency_ms":120}
        '400':
          description: Parte `image` ou campo `pedra` ausente/em branco no multipart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sem_pedra:
                  value:
                    error: "parte 'pedra' ausente ou em branco no multipart"
                sem_image:
                  value:
                    error: "parte 'image' ausente no multipart"
        '401':
          description: API key ausente ou invalida no header `X-API-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: API key ausente ou invalida

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Chave configurada em `marmore.api.key` (env `MARMORE_API_KEY`).
        Comparacao constante no tempo (anti timing-attack).

  parameters:
    AcceptSse:
      in: header
      name: Accept
      required: true
      schema:
        type: string
        const: text/event-stream
      description: Obrigatorio pelo predicado do router.

  schemas:
    ImagemGeradaResumo:
      type: object
      required: [id, criado_em, modelo, latencia_ms]
      properties:
        id:
          type: string
          format: uuid
          description: Id da imagem gerada (usado em `GET /images/{id}/arquivo`).
        criado_em:
          type: string
          format: date-time
          description: Momento da gravacao do metadado (ISO-8601).
        modelo:
          type: string
          description: Modelo de IA usado na geracao.
        custo_brl:
          type: number
          format: double
          nullable: true
          description: Custo em BRL; `null` quando nao foi possivel calcular.
        latencia_ms:
          type: integer
          format: int64
          description: Latencia da geracao, em milissegundos.
        pedra:
          type: string
          nullable: true
          description: Id da pedra escolhida no catalogo no momento da geracao.
        nome_pedra:
          type: string
          nullable: true
          description: |
            Nome comercial da pedra, resolvido do catalogo. `null` quando o id
            da pedra nao esta gravado ou nao existe no catalogo.
        produto:
          type: string
          nullable: true
          description: |
            Id do produto usado na geracao (ex.: `pia-americana`). `null`
            em imagens geradas antes do produto existir.
        nome_produto:
          type: string
          nullable: true
          description: |
            Nome de exibicao do produto, resolvido do catalogo. `null` quando
            o produto nao esta gravado ou nao e reconhecido.

    PedraResumo:
      type: object
      required: [id, nome, categoria]
      properties:
        id:
          type: string
          description: Identificador estavel da pedra (enviado na parte `pedra` do multipart).
        nome:
          type: string
          description: Nome comercial (ex.: Cafe Imperial).
        categoria:
          type: string
          description: Categoria do catalogo (ex.: Granitos, Marmores).

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensagem de erro amigavel.

    SseStatus:
      type: object
      required: [fase]
      description: Payload do evento de fase (`data:{"fase":"..."}`).
      properties:
        fase:
          type: string
          enum: [recebido, redimensionando, gerando]

    SseDone:
      type: object
      description: Payload do evento de conclusao.
      required: [latency_ms]
      properties:
        latency_ms:
          type: integer
          format: int64
          description: Latencia da chamada ao gateway, em milissegundos.
        custo_brl:
          type: number
          format: double
          nullable: true
          description: |
            Custo em BRL (USD x cotacao). `null` se a combinacao
            modelo/qualidade/tamanho nao estiver na tabela ou se a cotacao
            falhar.
        usage:
          type: object
          nullable: true
          additionalProperties: true
          description: JSON cru de `usage` retornado pelo provedor, ou `null`.

    SseError:
      type: object
      required: [error, latency_ms]
      description: Payload do evento de erro de negocio.
      properties:
        error:
          type: string
        latency_ms:
          type: integer
          format: int64
          description: Latencia medida ate a falha, em milissegundos.

    Base64Image:
      type: string
      format: byte
      description: |
        Imagem PNG resultante codificada em base64. Evento terminal enviado
        logo apos o evento de conclusao (`done`). Payload cru, sem envelope
        JSON.
