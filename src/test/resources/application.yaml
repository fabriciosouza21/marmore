# Configuracao de teste (substitui o application.yaml de producao nos @SpringBootTest).
# Como arquivos de resources de teste tem precedencia e NAO fazem merge com os de producao,
# precisa repetir aqui tudo que o contexto de teste exige.

spring:
  ai:
    openai:
      api-key: ignored
    # Spring AI 2.0: matchIfMissing=true ativa as autoconfigs se a propriedade esta ausente.
    # Definir com valor != "openai" desabilita cada autoconfig. Como a integracao da feature
    # de imagem e via RestClient direto (camada image.ai), nenhum modelo do Spring AI e usado.
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  codec:
    max-in-memory-size: 25MB
  datasource:
    url: jdbc:h2:mem:marmore;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

marmore:
  api:
    key: chave-teste-fixa
  storage:
    endpoint: http://localhost:9000
    access-key: teste
    secret-key: teste
    bucket: marmore-teste
  openai:
    image:
      api-key: ignored
      stone-path: ${user.dir}/data/granito.png
      pedras-path: ${user.dir}/data/pedras
  cost:
    usd-brl:
      url: https://economia.awesomeapi.com.br/json/last/USD-BRL
      cache-ttl: 6h
      fallback: 5.1075
