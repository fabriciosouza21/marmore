spring:
  application:
    name: api
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
  http:
    client:
      read-timeout: 180s
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

marmore:
  openai:
    image:
      base-url: https://api.openai.com
      api-key: ${spring.ai.openai.api-key:}
      default-model: gpt-image-2
      timeout: 180s
      stone-path: ${user.dir}/data/granito.png
